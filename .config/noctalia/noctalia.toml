[audio]
enable_overdrive = true

[backdrop]
enabled = true

[bar.default]
background_opacity = 0.8
capsule = true
capsule_thickness = 0.8
center = [ "media", "clock" ]
contact_shadow = true
end = [ "tray", "group:g1" ]
font_family = "Ubuntu Nerd Font Propo Med"
margin_ends = 10
padding = 10
panel_overlap = 0
radius = 50
start = [ "group:g2", "workspaces", "active_window" ]
thickness = 30
widget_spacing = 5

    [bar.default.monitor.DP-1]

    [bar.default.monitor.HDMI-A-1]
    thickness = 30

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "keyboard_layout", "network", "bluetooth", "notifications", "volume", "brightness", "battery", "widget", "bar" ]
    opacity = 1
    padding = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "cpu", "temp", "sysmon", "ram" ]
    opacity = 1
    padding = 5

[brightness]
enable_ddcutil = true
minimum_brightness = 0.05

[control_center]
sidebar_section = "none"
width = 760

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
active_monitor_only = true
active_scale = 1.1
background_opacity = 0.8
cross_axis_padding = 5
enabled = true
icon_size = 35
inactive_opacity = 1
inactive_scale = 1
item_spacing = 5
launcher_icon = "brand-windows-filled"
launcher_position = "start"
magnification_scale = 1.2
main_axis_padding = 30
radius = 15
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock", "screen-off" ]

    [idle.behavior.lock]
    action = "screen_off"
    enabled = true
    timeout = 300

    [idle.behavior.screen-off]
    action = "lock"
    enabled = true
    timeout = 360

[location]
address = "Perm"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-0000000000000001",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 8
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196
    box_width = 810
    cx = 1280
    cy = 1258
    output = "DP-1"
    placement_height = 1440
    placement_width = 2560
    rotation = 0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.9
        background_radius = 10
        center_password_text = false
        input_opacity = 1
        input_radius = 5
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196
    box_width = 810
    cx = 540
    cy = 1738
    output = "HDMI-A-1"
    placement_height = 1920
    placement_width = 1080
    rotation = 0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.9
        background_radius = 10
        center_password_text = false
        input_opacity = 1
        input_radius = 5
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 544
    box_width = 672
    cx = 1312
    cy = 720
    output = "DP-1"
    placement_height = 1440
    placement_width = 2560
    rotation = 0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_color = "surface"
        background_opacity = 1
        background_padding = 0
        background_radius = 30
        center_text = true
        circle = true
        clock_style = "digital"
        color = "on_surface"
        font_family = "Adwaita Sans"
        format = "{:%H:%M}"
        shadow = true
        timezone = ""

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 72
    box_width = 184
    cx = 972
    cy = 1072
    output = "DP-1"
    placement_height = 1440
    placement_width = 2560
    rotation = 0
    type = "weather"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 96
    box_width = 600
    cx = 1364
    cy = 1064
    output = "DP-1"
    placement_height = 1440
    placement_width = 2560
    rotation = 0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        bands = 32
        centered = false
        mirrored = false
        reversed = false
        show_when_idle = true

[osd]
background_opacity = 0.9
follow_focused_output = true
offset_y = 10
orientation = "vertical"
position = "top_right"
position_vertical = "top_right"

[plugin_settings."andrewdems/vpn-manager"]
panel_placement = "floating"

[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "niri"

[plugin_settings."yuuto/arch-updater"]
auto_check_hours = 6
panel_placement = "floating"

[plugins]
enabled = [ "kenn/keybind-cheatsheet", "yuuto/arch-updater", "andrewdems/vpn-manager" ]

[shell]
corner_radius_scale = 2
font_family = "Ubuntu Nerd Font Propo Med"
lang = "ru"
niri_overview_type_to_launch_enabled = true
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
settings_expand_all_groups = true
settings_show_advanced = true

    [shell.launcher]
    app_grid = true
    category_icons_only = true
    compact = false
    default_view = "all"
    search_position = "top"
    show_app_actions = true
    show_session_button = false
    show_settings_button = false

        [shell.launcher.providers.emoji]
        global = true

        [shell.launcher.providers.panels]
        global = true

        [shell.launcher.providers.session]
        global = false

        [shell.launcher.providers.wallpaper]
        global = false

    [shell.panel]
    control_center_placement = "floating"
    floating_offset = 10
    list_item_background = true
    open_near_click_clipboard = true
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.session]
    grid = true

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0
        enabled = true
        shortcut = "1"
        variant = "secondary"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0
        enabled = true
        shortcut = "2"
        variant = "outline"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 5
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 5
        enabled = true
        shortcut = "5"
        variant = "destructive"

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "niri", "qt" ]
    community_ids = [ "zen-browser" ]
    enable_community_templates = true

[wallpaper]
directory = "/home/net_vlador/Pictures/walls-catppuccin-mocha"
fill_color = "primary"
per_monitor_directories = true
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 60

    [wallpaper.default]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/swirls.jpg"

    [wallpaper.last]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/toast.png"

    [wallpaper.monitor.DP-1]
    directory = "/home/net_vlador/Pictures/walls-catppuccin-mocha"

    [wallpaper.monitor.HDMI-A-1]
    directory = "/home/net_vlador/Pictures/walls-catppuccin-mocha"

    [wallpaper.monitors.DP-1]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/toast.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/diner-lonely-road.jpg"

    [[wallpaper.favorite]]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/swirls.jpg"

    [[wallpaper.favorite]]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/sword.jpg"

    [[wallpaper.favorite]]
    path = "/home/net_vlador/Pictures/walls-catppuccin-mocha/keyboard-2.png"

[widget.bar]
type = "andrewdems/vpn-manager:bar"

[widget.brightness]
show_label = false

[widget.clock]
capsule = false
format = "{:%d %B %Y, %H:%M}"

[widget.cpu]
show_value = false

[widget.keyboard_layout]
show_glyph = false

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.ram]
interactive = false
show_tooltip = false
show_value = false

[widget.sysmon]
interactive = false
show_tooltip = false
show_value = false

[widget.temp]
interactive = false
show_tooltip = false
show_value = false
stat = "gpu_temp"

[widget.volume]
show_label = false

[widget.widget]
type = "yuuto/arch-updater:widget"

[widget.workspaces]
label_source = "name"
max_label_chars = 3
show_tooltip = false
style = "minimal"
